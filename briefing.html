<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>STEMConnect26 - Company Problem Briefing</title>
<style>
  :root {
    --bg: #f3f5f9; --surface: #ffffff; --border: #e4e8f0; --border-subtle: #eef1f6;
    --text: #0f172a; --text-muted: #64748b; --text-light: #94a3b8; --primary: #4f46e5;
    --green-bg: #ecfdf5; --green-txt: #047857; --blue-bg: #eff6ff; --blue-txt: #1d4ed8;
    --purple-bg: #f5f3ff; --purple-txt: #6d28d9; --amber-bg: #fffbeb; --amber-txt: #92400e;
    --red-bg: #fef2f2; --red-txt: #b91c1c; --red-border: #fecaca; --pink-bg: #fdf2f8; --pink-txt: #be185d;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 13px; line-height: 1.45; padding: 16px; -webkit-font-smoothing: antialiased; }
  .wrap { max-width: 1280px; margin: 0 auto; }
  .topbar { position: sticky; top: 0; z-index: 50; background: linear-gradient(180deg, #ffffff 0%, #fbfcfe 100%); border: 1px solid var(--border); border-radius: 14px; padding: 12px 16px; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; box-shadow: 0 6px 24px rgba(15,23,42,.06); }
  .brand { font-size: 16px; font-weight: 800; letter-spacing: -.02em; }
  .brand small { display: block; font-size: 11px; font-weight: 500; color: var(--text-muted); letter-spacing: 0; }
  .search { flex: 1 1 260px; min-width: 200px; border: 1px solid var(--border); border-radius: 9px; padding: 8px 11px; font-size: 12.5px; color: var(--text); background: #fff; }
  .search:focus { outline: 2px solid #c7d2fe; border-color: var(--primary); }
  .viewtabs { display: flex; gap: 6px; }
  .viewtab { border: 1px solid var(--border); background: #fff; color: var(--text-muted); border-radius: 999px; padding: 6px 12px; font-size: 12px; font-weight: 700; cursor: pointer; }
  .viewtab.active { background: var(--primary); border-color: var(--primary); color: #fff; }
  .stats { display: flex; flex-wrap: wrap; gap: 12px; margin: 12px 2px 0; color: var(--text-muted); font-size: 11.5px; }
  .stats b { color: var(--text); }
  .pills { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0; }
  .pill { border: 1px solid var(--border); background: #fff; border-radius: 12px; padding: 8px 12px; cursor: pointer; display: flex; flex-direction: column; gap: 2px; min-width: 150px; transition: all .12s; }
  .pill:hover { border-color: #c7d2fe; }
  .pill.active { border-color: var(--primary); box-shadow: 0 0 0 2px #e0e7ff inset; }
  .pill .p-name { font-weight: 800; font-size: 12.5px; }
  .pill .p-meta { font-size: 10.5px; color: var(--text-muted); }
  .pill .p-prog { height: 4px; border-radius: 999px; background: var(--border); margin-top: 4px; overflow: hidden; }
  .pill .p-prog i { display: block; height: 100%; background: #22c55e; width: 0%; transition: width .2s; }
  .section { margin-bottom: 22px; }
  .snapshot { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px; }
  .snapshot h2 { font-size: 15px; font-weight: 800; }
  .snap-meta { font-size: 11px; color: var(--text-muted); }
  .fit { font-size: 11px; font-weight: 800; border-radius: 999px; padding: 3px 9px; background: var(--pink-bg); color: var(--pink-txt); }
  .snap-links { margin-left: auto; display: flex; gap: 6px; flex-wrap: wrap; }
  .snap-links a { font-size: 11px; font-weight: 700; text-decoration: none; padding: 3px 9px; border-radius: 999px; background: var(--purple-bg); color: var(--purple-txt); border: 1px solid #ddd6fe; }
  .visa-line { font-size: 11px; border-radius: 8px; padding: 5px 9px; background: var(--green-bg); color: var(--green-txt); border: 1px solid #a7f3d0; max-width: 100%; }
  .visa-line.warn { background: var(--red-bg); color: var(--red-txt); border-color: var(--red-border); }
  .cards { display: grid; grid-template-columns: 1fr; gap: 12px; margin-top: 12px; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
  .card-head { display: flex; align-items: flex-start; gap: 10px; padding: 11px 14px; border-bottom: 1px solid var(--border-subtle); background: #fbfcfe; }
  .card-num { flex: 0 0 auto; width: 22px; height: 22px; border-radius: 7px; background: var(--primary); color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 12px; }
  .card-title { font-weight: 800; font-size: 13px; }
  .card-src { font-size: 10.5px; }
  .card-src a { color: var(--primary); text-decoration: none; font-weight: 700; }
  .card-actions { margin-left: auto; display: flex; gap: 6px; align-items: center; }
  .reviewed-btn { border: 1px solid var(--border); background: #fff; border-radius: 8px; padding: 4px 9px; font-size: 11px; font-weight: 700; cursor: pointer; color: var(--text-muted); white-space: nowrap; }
  .card.reviewed { border-color: #a7f3d0; }
  .card.reviewed .reviewed-btn { background: var(--green-bg); color: var(--green-txt); border-color: #a7f3d0; }
  .flow { display: grid; grid-template-columns: 1.05fr 34px 1.25fr 34px 1fr; align-items: stretch; padding: 12px 14px; gap: 0; }
  .flow-col { display: flex; flex-direction: column; gap: 5px; }
  .flow-label { font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: .07em; color: var(--text-light); }
  .flow-arrow { display: flex; align-items: center; justify-content: center; color: #c7d2fe; font-size: 18px; font-weight: 800; }
  .problem-box { background: var(--red-bg); border: 1px solid var(--red-border); border-radius: 9px; padding: 8px 10px; font-size: 11.5px; }
  .play-box { background: var(--blue-bg); border: 1px solid #bfdbfe; border-radius: 9px; padding: 8px 10px; font-size: 11.5px; }
  .why-line { font-size: 10.5px; color: var(--text-muted); }
  .chips { display: flex; flex-direction: column; gap: 5px; }
  .chip { display: inline-block; font-size: 10.5px; background: #fff1f2; color: var(--red-txt); border: 1px solid var(--red-border); border-radius: 8px; padding: 5px 8px; }
  .hook-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 0 14px 12px; }
  .hook-box { background: var(--amber-bg); border: 1px solid #fde68a; border-radius: 9px; padding: 8px 10px; font-size: 11.5px; color: var(--amber-txt); }
  .ask-box { background: var(--purple-bg); border: 1px solid #ddd6fe; border-radius: 9px; padding: 8px 10px; font-size: 11.5px; color: var(--purple-txt); display: flex; gap: 8px; align-items: flex-start; }
  .ask-box button { flex: 0 0 auto; border: 1px solid #ddd6fe; background: #fff; border-radius: 7px; font-size: 10px; font-weight: 700; padding: 3px 7px; cursor: pointer; color: var(--purple-txt); }
  .bottleneck-tags { display: flex; flex-wrap: wrap; gap: 5px; }
  table { width: 100%; border-collapse: collapse; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
  th { background: #f8fafc; padding: 8px 12px; font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .07em; color: #7c8aa0; text-align: left; border-bottom: 1px solid var(--border); }
  td { padding: 8px 12px; border-bottom: 1px solid var(--border-subtle); font-size: 12px; vertical-align: top; }
  tr:last-child td { border-bottom: none; }
  .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: var(--red-border); }
  .dot.on { background: var(--primary); }
  .q-company { font-weight: 800; white-space: nowrap; }
  .copy-btn { border: 1px solid var(--border); background: #fff; border-radius: 7px; padding: 3px 8px; font-size: 10px; font-weight: 700; cursor: pointer; color: var(--text-muted); }
  .hidden { display: none !important; }
  footer { margin-top: 22px; padding: 12px 4px; color: var(--text-light); font-size: 11px; }
  @media (max-width: 900px) {
    .flow { grid-template-columns: 1fr; gap: 8px; }
    .flow-arrow { display: none; }
    .hook-row { grid-template-columns: 1fr; }
  }
  @media print {
    .topbar, .pills, .reviewed-btn, .ask-box button { display: none !important; }
    body { background: #fff; padding: 0; }
    .card { break-inside: avoid; }
  }
</style>
</head>

<div class="wrap">
  <div class="topbar">
    <div class="brand">STEMConnect26 - Company Problem Briefing
      <small id="fairLine"></small>
    </div>
    <input id="search" class="search" placeholder="Search problems, plays, bottlenecks (e.g. warranty, tariff, FERC)...">
    <div class="viewtabs">
      <button class="viewtab active" data-view="companies">Companies</button>
      <button class="viewtab" data-view="questions">Question Bank</button>

  <div class="stats" id="stats"></div>

</div>
<script>
const briefing = {"fair": {"name": "SASE STEM Connect 26", "location": "Seattle, WA", "dates": "Professional Conference Oct 1-3, 2026 | Collegiate Conference Oct 2-3 | STEM Career Fair Oct 3-4", "site": "https://stemconnect.events/", "job_board": "https://job-board.saseconnect.org/", "floorplan": "https://rocexhibitions.expocad.com/Events/26sase/index.html", "generated": "2026-09-30"}, "companies": [{"company": "Ford Motor Company", "website": "https://www.ford.com", "careers_url": "https://www.careers.ford.com/", "job_search_url": "https://www.careers.ford.com/search-jobs", "hq": "Dearborn, Michigan, USA", "size": "~170,000+ employees worldwide; ~$185B revenue (2024)", "industry": "Automotive / Mobility", "business": "Ford designs, manufactures and sells Ford and Lincoln vehicles — trucks, SUVs, EVs and commercial vehicles — plus financing through Ford Credit and aftersales parts and service. It makes money primarily on vehicle sales to dealers and fleet customers, with growing software, connected-services and subscription revenue (e.g., BlueCruise hands-free driving). Ford is investing heavily in EVs, batteries and integrated software/AI services to diversify beyond traditional vehicle margins.", "core_values": ["Do the right thing", "Put people first", "Customer obsessed", "Play to win", "Build a better world"], "ceo": "Jim Farley, President & CEO (2026)", "h1b_sponsorship": "Yes — 5,131 LCA records on h1bdata.info (median $110,310), by far the largest sponsor in this batch; historically sponsors data science, software and IT roles out of Dearborn. 2026 LCA activity confirms continued filings.", "us_person_required": "No — standard automotive roles (analytics/IT) do not require U.S. person status; some government-contract, defense-adjacent or battery-tech programs may impose export-control screens on a case-by-case basis.", "open_jobs": [{"title": "Data Scientist", "location": "Dearborn, Michigan", "url": "https://www.careers.ford.com/job/dearborn/data-scientist/48560/101327853024"}, {"title": "Data Python Scientist", "location": "Dearborn, Michigan", "url": "https://www.careers.ford.com/job/dearborn/data-python-scientist/48560/101356292272"}, {"title": "Data Governance Analyst", "location": "Dearborn, Michigan", "url": "https://www.careers.ford.com/job/dearborn/data-governance-analyst/48560/100650181312"}, {"title": "Data Product Manager", "location": "Dearborn, Michigan", "url": "https://www.careers.ford.com/job/dearborn/data-product-manager/48560/101370460288"}, {"title": "AI/ML Integration Technologist (Battery Mfg)", "location": "Dearborn, Michigan", "url": "https://www.careers.ford.com/job/dearborn/ai-ml-integration-technologist-battery-mfg/48560/101282503344"}], "fit_score": 84, "fit_rationale": "Ford is the strongest sponsor in this batch (5,131 H-1B LCAs) and currently posts Data Scientist, Data Python Scientist and Data Governance Analyst roles that map directly to her MS, Python/scikit-learn/LightGBM skills and 70M+ event NVIDIA modeling work. SASE speakers Dan Chon (Head of Data, Analytics and AI, Integrated Services) and Kalpana Nagalingam (Director, Global Data, Insight & Analytics) make Ford the single best booth conversation for an F-1 analytics candidate. Downside: roles are Dearborn-based, so relocation from Seattle would be required.", "talking_points": ["Name-drop the SASE speakers: ask about Dan Chon's Integrated Services data/AI org and Kalpana Nagalingam's Global Data Insight & Analytics team — both hire data scientists.", "Lead with the NVIDIA 70M+ event LightGBM model (0.72–0.74 AUC, 25x lift) and Oracle churn analysis ($75M ARR at risk) as proof of end-to-end modeling.", "Ask directly whether Global Data Insight & Analytics sponsors H-1B for new-grad data scientists and what the OPT-to-H-1B pipeline looks like."], "booth": "", "problems": [{"title": "Recall and quality crisis: record 152 NHTSA recalls in 2025", "problem": "Ford issued a record 152 safety recalls in 2025 — the most by any automaker in a single year, nearly double GM's prior record of 77 in 2014 — spanning parking modules that allow rollaways, fire-risk electrical faults, and detaching parts (CBT News, Jan 2026). About 40 of those recalls were reissued software updates after audits found gaps in how OTA installations were verified. Ford doubled its safety team and expanded software validation over two years, and it told investors warranty costs are finally declining, but the volume of field failures is still forcing dealership service bottlenecks and holding some new vehicles undeliverable.", "source": "https://www.cbtnews.com/ford-posts-record-152-recalls-in-2025-but-says-vehicle-quality-is-improving/", "why_data_team": "Ford's Quality organization and the Integrated Services / software analytics teams own this; defect discovery now runs through connected-vehicle telemetry, warranty claims, dealer repair notes, and software audit logs — all data-heavy systems where early-warning models and pipeline reliability determine how fast Ford catches defects before they become headlines.", "solution": "Build a defect early-warning platform that fuses connected-vehicle telemetry, warranty claims, dealer free-text repair data, and supplier part-lot genealogy into one pipeline, then scores every VIN and part lot daily for failure propensity using gradient-boosted survival/classification models. Add NLP/RAG over repair narratives to classify emerging failure modes and cluster complaints into candidate defect signals, plus automated reconciliation that verifies OTA update success rates to catch the 40-recall reissue pattern. A weekly 'recall risk leaderboard' by program, plant, and supplier would let engineering act before NHTSA thresholds are hit.", "bottlenecks": ["Warranty claims and dealer repair narratives arrive with weeks-to-months lag and inconsistent free-text coding, weakening early signal", "Telemetry, warranty, supplier, and software-audit data live in separate systems with different VIN keying, making joins lossy", "Attribution across part lots requires supplier genealogy data Ford does not fully control", "Recall decisions carry legal and regulator-reporting constraints, so models can only advise, not auto-trigger, actions"], "mimansa_connection": "Mimansa's 70M+ event ETL pipeline and LightGBM model (0.72–0.74 AUC, 25x targeting lift) is exactly the pattern needed to score millions of VINs for defect propensity off noisy warranty and telemetry data.", "booth_question": "With 152 recalls last year, how is the quality analytics team using connected-vehicle telemetry and dealer repair text for early defect detection, and where do data engineering versus data science responsibilities sit in that pipeline?"}, {"title": "Supply-chain fragility: F-150 line halts and the Novelis aluminum fallout", "problem": "A supplier component shortage halted F-150 production at Ford's Dearborn Truck Plant for roughly a week starting Sept 24, 2026, idling the Kansas City F-150 plant too, and CEO Jim Farley confirmed it will dent Q3 2026 wholesale truck deliveries (Quartz/Yahoo Finance, Sept 30, 2026; Detroit Free Press, Sept 25, 2026). This compounds the September and November 2025 fires at the Novelis aluminum plant in Oswego, NY: Ford absorbed roughly $800M in charges in the first half of 2025 alone, the disruption is expected to cost about $1.5B total, and F-Series sales were still down 11% through August 2026 as Ford tries to build 150,000 extra trucks to recover.", "source": "https://finance.yahoo.com/markets/stocks/articles/ford-f-150-supplier-disruption-163352684.html ; https://www.freep.com/story/money/cars/ford/2026/09/25/ford-f-150-dearborn-truck-production-down/91939468007/ ; https://www.detroitnews.com/story/business/autos/ford/2026/09/30/f-150-supplier-disruption-to-hit-3q-sales-ford-ceo-jim-farley-says/92021499007/", "why_data_team": "Ford's Supply Chain and Enterprise Analytics organizations own supplier risk, inventory, and production planning; the F-150 is Ford's profit engine, so even short line stoppages are a forecasting, visibility, and optimization problem across multi-tier supplier, logistics, and plant data.", "solution": "Stand up an end-to-end supplier risk and disruption analytics product: consolidate internal procurement, plant inventory, logistics, and quality data with external signals (supplier financial health, weather, facility events, port congestion) into automated DAG pipelines, then use graph analytics to map multi-tier dependencies and flag single points of failure like the Novelis aluminum site. Layer ML models for component shortage probability and days-of-supply forecasting, and run scenario simulation of plant shutdown/recovery to recommend buffer inventory and alternate sourcing before lines stop. Dynamic re-planning models can also reallocate scarce components across Dearborn, Kansas City, and Kentucky to protect the highest-margin mix.", "bottlenecks": ["Tier-2/Tier-3 suppliers don't share capacity, inventory, or business-continuity data, so visibility stops at Tier 1", "Key inputs like aluminum were effectively single-sourced, so there is no fast alternate supply even when the risk is known", "Production re-planning has to run on short cycles (days) against long lead times and union/labor constraints", "External disruption signals are noisy, and false alarms erode trust in the model with planners"], "mimansa_connection": "Mimansa's automated DAG pipelines consolidating 40+ sources is directly applicable to fusing procurement, plant, logistics, and external disruption feeds into one supplier-risk data layer.", "booth_question": "After the Novelis fires and the recent F-150 supplier shortage, how far down Ford's supplier tiers does risk data actually reach, and what would a successful supplier early-warning data product need to prove to planners?"}, {"title": "EV losses and tariff exposure forcing a capital-allocation pivot", "problem": "Ford posted an $11.1B Q4 2025 net loss — its largest quarterly loss since 2008 — after losing $4.8B on EVs in 2025, and it projects $4B–$4.5B more EV losses in 2026 while targeting break-even only in 2029 (NY Post/Fox Business, Feb 11, 2026). In December 2025 Ford took a $19.5B charge on EV assets and its product roadmap as it cut F-150 Lightning production and refocused on hybrids and a $30,000 EV platform; separately, tariffs cost roughly $2B in 2025 (including an unplanned $900M hit from a retroactivity change) and are expected to stay near that level in 2026. Full-year EBIT of $6.8B narrowly missed the revised $7B guidance even as Q4 revenue of $45.9B beat expectations.", "source": "https://nypost.com/2026/02/11/business/ford-ceo-admits-that-the-customer-has-spoken-after-ev-push-drives-major-quarterly-loss/ ; https://www.msn.com/en-us/money/top-stocks/history-says-what-ford-stock-has-done-in-the-2-years-after-each-full-year-loss/ar-AA2b9bjH", "why_data_team": "Ford's Finance/Strategy analytics, Ford Pro and Model e business teams, and Enterprise Data & AI own the unit-economics, demand-forecasting, and scenario models that guide where capital goes — this is fundamentally an analytics problem of measuring true per-vehicle profitability and forecasting demand by powertrain under policy uncertainty.", "solution": "Build a powertrain-level profitability and scenario platform: a per-model, per-vehicle contribution-margin model that decomposes material, tariff, battery, warranty, and incentive costs from transactional and BOM data — the analytics equivalent of a DCF per vehicle line. Layer demand forecasting that segments EV vs hybrid vs ICE by region, incentive environment, and tax-credit status, and run Monte Carlo tariff/regulatory scenarios to produce decision-ready ranges for capital allocation, similar to how a churn model prioritizes retention spend. Automated pipelines refreshing these models weekly would replace static annual planning assumptions with continuously updated capital-allocation signals.", "bottlenecks": ["EV demand and policy (tax credits, tariffs, retroactivity rules) shift faster than traditional annual planning cycles", "Per-vehicle cost data is fragmented across BOM, supplier contracts, warranty, and segment accounting, making true unit economics hard to observe", "$19.5B in written-down EV assets creates organizational resistance to models that might recommend further cuts", "Tariff and regulatory rules change with little notice, so models need fast re-parameterization and transparent assumptions to be trusted by finance"], "mimansa_connection": "Mimansa's $75M ARR churn model shows she can translate messy behavioral/financial data into quantified dollar impact, and her DCF financial modeling maps directly to building EV unit-economics and tariff scenario models.", "booth_question": "As Ford realigns its EV roadmap, which analytics output has the most credibility in capital-allocation debates — per-vehicle contribution-margin models or powertrain demand forecasting — and how does the data team handle fast-moving tariff assumptions?"}]}, {"company": "BNSF Railway", "website": "https://www.bnsf.com/", "careers_url": "https://jobs.bnsf.com/", "job_search_url": "https://jobs.bnsf.com/us/en/search-results", "hq": "Fort Worth, TX", "size": "~36,000 employees; 33,400 track miles across 28 states; 8,000+ locomotives; wholly owned subsidiary of Berkshire Hathaway (Wikipedia)", "industry": "Class I freight railroad / rail transportation & logistics", "business": "BNSF is the largest freight railroad in the United States, one of six Class I railroads, with three transcontinental routes connecting the western and eastern US. It moves intermodal containers, coal, grain, automotive and industrial products, competing mainly with Union Pacific in a western-rail duopoly. It has been a wholly owned Berkshire Hathaway subsidiary since 2010 and continues major infrastructure investment ($3.6B capital plan announced for 2026).", "core_values": ["Safety", "Service", "Integrity", "Respect", "Teamwork"], "ceo": "Kathryn 'Katie' Farmer, President & CEO (as of 2026; first woman to lead a Class I railroad)", "h1b_sponsorship": "Yes - h1bdata.info shows 92 LCA filings 2014-2026 for 'BNSF Railway Company' (median $165,000), including Senior Data Engineer, Senior Data Scientist, Software Engineer II Data Engineer, Software Engineer Tech Trainee, and Sr. Operations Research & Advanced Analytics Specialist; recent 2025-26 filings include WA locations (Bellevue, Everett, Lynnwood, Renton).", "us_person_required": "No (corporate/IT) - no blanket US-person requirement for corporate, tech or analytics roles; some safety/security-sensitive rail-operations systems roles may carry restrictions, but BNSF's sponsorship record shows international hires are made.", "open_jobs": [{"title": "Sr Staff Data Scientist (Remote US)", "location": "Remote - US", "url": "https://jobs.bnsf.com/us/en/job/95417/Sr-Staff-Data-Scientist-Remote-US"}, {"title": "BNSF Tech Trainee 2027 (new-grad tech pipeline)", "location": "Remote - US", "url": "https://jobs.bnsf.com/us/en/job/95881/bnsf-tech-Trainee-2027-Remote-US"}, {"title": "Accounting & Finance Management Trainee 2027 (new grad)", "location": "Topeka, KS", "url": "https://jobs.bnsf.com/us/en/job/95807/Accounting-Finance-Management-Trainee-Topeka-KS-2027"}, {"title": "Sr Analyst / Asst Mgr - Accounting Cost Recovery Team", "location": "Fort Worth, TX (HQ; verify on posting)", "url": "https://jobs.bnsf.com/us/en/job/95983/Sr-Analyst-Asst-Mgr-Accounting-Cost-Recovery-Team"}, {"title": "Network Strategy & Capacity Planning Summer Intern 2027", "location": "Not specified in listing URL; verify on posting", "url": "https://jobs.bnsf.com/us/en/job/95812/Network-Strategy-Capacity-Planning-Summer-Intern-2027"}], "fit_score": 83, "fit_rationale": "BNSF is hiring directly into data science and data engineering (Senior Data Scientist, Data Engineer, Tech Trainee roles with H-1B precedent and a Seattle-area footprint in Bellevue/Everett/Lynnwood), matching Mimansa's Python/LightGBM, SQL and Airflow DAG skills. Her 70M+ event NVIDIA pipeline (0.72-0.74 AUC, 25x lift) and forecasting/econometrics background map cleanly to rail demand, capacity and network-planning analytics, and her DCF/financial modeling plus $75M churn and $1.01M revenue analyses fit BNSF's finance and cost-recovery roles. Seattle-based, so no relocation friction for WA or remote-US postings.", "talking_points": ["Lead with scale forecasting: the 70M+ event ML pipeline (0.72-0.74 AUC, 25x lift) as evidence she can model network demand and asset utilization at railroad data volumes.", "Highlight ETL/Airflow work at Dark Alpha Capital (DAGs consolidating 40+ sources) plus AWS/PostgreSQL as a match for BNSF's data platform and 'Tech Trainee' pipeline.", "Reference her Seattle base and BNSF's Pacific Northwest operations/Interbay and the Bellevue-area tech hiring as a location advantage; ask about the 2026 capital plan's analytics priorities."], "booth": "", "problems": [{"title": "Cost inflation eroding the operating ratio despite 7% volume growth", "problem": "In Q2 2026 BNSF's revenue rose 15% to $6.6 billion and volume rose 7% to 2.5 million units, yet its operating ratio worsened by 0.6 points as operating expenses jumped 16% to $4.3 billion, led by a 68% surge in fuel expense to $1.2 billion and a 2% rise in compensation and benefits to $1.4 billion from wage inflation (Progressive Railroading, Aug 10, 2026, citing BNSF's Q2 2026 quarterly financial performance review). BNSF has budgeted $3.6 billion of 2026 capital investment, down from $3.8 billion in 2025, with $2.8 billion earmarked for maintenance including 13,000 miles of surfacing, 2.5 million rail ties and 400+ miles of rail (Progressive Railroading, Jan 27, 2026). Moving more freight while unit costs rise is a classic productivity and cost-attribution analytics gap heading into the career fair.", "source": "https://www.progressiverailroading.com/bnsf_railway/news/BNSF-scores-more-revenue-income-and-volume-in-second-quarter--77514; https://www.progressiverailroading.com/bnsf_railway/news/BNSF-budgets-36B-for-capital-expenditures-in-2026--76238; https://www.bnsf.com/about-bnsf/financial-information/pdf/performance-summary-q2-2026.pdf", "why_data_team": "BNSF's operations, finance and service-performance analytics teams own cost-to-serve, fuel efficiency and crew-productivity reporting; explaining OR variance requires joining waybill, locomotive telemetry, fuel and payroll data at scale, which is inherently a data engineering and modeling problem.", "solution": "Build a cost-driver attribution pipeline that joins train-level fuel burn, locomotive telemetry, tonnage and crew data to decompose operating-ratio variance by corridor and commodity, then use gradient-boosted models to forecast opex and flag anomalies before they hit the quarter. Layer a fuel-efficiency predictor (train makeup, horsepower-per-ton, weather, speed) specifically at the +68% fuel line, plus a crew-productivity and dwell dashboard to protect the compensation line. Orchestrate it as scheduled DAGs with data-quality checks so finance and operations see the same numbers.", "bottlenecks": ["Fuel price volatility is largely exogenous and hedged, limiting controllable levers", "Locomotive and capex cycles (budget cut to $3.6B) constrain efficiency gains", "Crew scheduling is governed by union agreements, restricting optimization headroom", "Ops, finance, mechanical and fuel data live in siloed legacy systems"], "mimansa_connection": "Her 70M+ event ETL pipeline feeding a LightGBM model (0.72-0.74 AUC, 25x lift) is the same pattern needed for train-level cost-driver attribution and opex anomaly detection.", "booth_question": "How does BNSF's analytics org currently decompose operating-ratio variance — is it still reporting-heavy, and where would a cost-attribution or anomaly-detection model create the most value?"}, {"title": "UP-NS merger threat demands competitive and regulatory analytics", "problem": "Union Pacific's proposed $85 billion acquisition of Norfolk Southern would create the first transcontinental U.S. rail network (Reuters/CNBC coverage, July 2025). The Surface Transportation Board adopted a procedural schedule for the revised major merger application on Aug 18, 2026 and on Sept 18, 2026 denied motions seeking summary denial; BNSF filed a petition asking STB to enforce and review the 1990s Union Pacific/Southern Pacific merger conditions, and BNSF, CPKC and CSX are pressing for broad access to any combined UP-NS network. BNSF is running a public 'Preserve Rail Competition' campaign at bnsf.com/merger, and the STB has also been finalizing BNSF access terms elsewhere (e.g., Lake Charles, July 21, 2026).", "source": "https://www.stb.gov/news-communications/latest-news/; https://www.stb.gov/news-communications/latest-news/pr-26-21/; https://www.stb.gov/news-communications/latest-news/pr-26-23/; https://www.stb.gov/news-communications/latest-news/pr-26-17/; https://www.bnsf.com/merger; https://news.google.com/rss/search?q=BNSF+Railway+STB+service+2025&hl=en-US&gl=US&ceid=US:en", "why_data_team": "This is a strategic/market analytics problem owned by BNSF's planning, marketing and regulatory teams, which need traffic-flow, rate and network models to quantify competitive harm and justify access remedies in STB filings.", "solution": "Stand up a merger-impact simulation: ingest STB waybill/carload data, BNSF revenue and interchange records, and build origin-destination diversion models to estimate which traffic, gateways and rates shift to a combined UP-NS under different access remedies. Add RAG over STB filings to track applicant commitments and precedent conditions, and expose scenario dashboards with DCF-style revenue impacts so leadership can argue for conditions with evidence. Orchestrate STB, shipper and internal sources into one repeatable evidence pipeline.", "bottlenecks": ["Waybill and rate data are confidential, lagged and often sample-based", "STB regulatory timelines are exogenous and move quickly", "Legal, finance and network-planning data are siloed across departments", "Access remedies are negotiated outcomes, not purely analytical outputs"], "mimansa_connection": "Her DCF/financial modeling plus RAG pipelines map directly to merger scenario modeling and extracting commitments from dense STB filings.", "booth_question": "As the UP-NS proceeding moves through the STB, is BNSF building quantitative network-diversion models to support its case, and would analytics hires contribute?"}, {"title": "Coal volume down 8% as plant retirements and cheap gas accelerate the energy transition", "problem": "BNSF's coal volume fell 8% year over year to 268,000 units in Q2 2026 — the only business unit with declining volume — which BNSF attributed to power-plant retirements and lower natural-gas prices, even as coal revenue inched up 1% to $722 million on price and yield (Progressive Railroading, Aug 10, 2026). Over the same quarter, consumer-products intermodal volume grew 9% to 1.6 million units and agricultural/energy volume grew 12%, so the railroad must forecast a major mix shift to redeploy locomotives, hopper cars and crews. BNSF's 2026 plan funds Barstow, Phoenix and yard expansions precisely to serve that growth.", "source": "https://www.progressiverailroading.com/bnsf_railway/news/BNSF-scores-more-revenue-income-and-volume-in-second-quarter--77514; https://www.progressiverailroading.com/bnsf_railway/news/BNSF-budgets-36B-for-capital-expenditures-in-2026--76238", "why_data_team": "Demand forecasting sits with BNSF's marketing/planning analytics organization; forecasting coal by mine, utility and plant needs econometric and hierarchical models fed by EIA, customer and internal shipment data.", "solution": "Build a plant-level coal-demand forecast that models utility burn using natural-gas price cointegration, retirement schedules and EIA data, then rolls up hierarchically to corridor and fleet decisions. Treat plant retirements like a churn problem (survival/hazard model) to predict timing risk, and couple the forecast to car/locomotive allocation and long-range capex scenarios so capacity can be redeployed toward intermodal lanes growing 9-12%. Automate the pipeline so forecasts refresh as gas prices and retirement announcements change.", "bottlenecks": ["Natural-gas prices and EPA rules are exogenous shocks", "Utility retirement plans shift with policy and data-center load growth", "Long asset lives make capacity reallocation slow and capital-intensive", "Customer/utility demand data is often contractual and lagged"], "mimansa_connection": "Her $75M ARR churn model and econometrics training translate directly to plant-retirement hazard modeling and gas-price-driven coal demand forecasting.", "booth_question": "How does BNSF forecast coal demand decline by utility and plant, and does that forecasting sit with the analytics team or with marketing?"}]}, {"company": "Constellation Energy", "website": "https://www.constellationenergy.com", "careers_url": "https://www.constellationenergy.com/careers.html", "job_search_url": "https://jobs.constellationenergy.com/careers-home/jobs", "hq": "Baltimore, Maryland, USA", "size": "~16,500 employees (company careers site, 2026)", "industry": "Energy (Power Generation & Retail Energy)", "business": "Constellation is the largest US producer of emissions-free energy, operating the nation's biggest nuclear fleet (19+ GW) plus gas, hydro, wind and solar assets, and selling power and energy management services to 2M+ customers including 80% of the Fortune 100. It makes money from wholesale power generation and long-term contracts (e.g., the Microsoft Three Mile Island restart deal) and retail electricity/natural gas sales. The 2026 Calpine acquisition added ~$16B of gas and geothermal capacity and major data-center power deals.", "core_values": ["We Are Exceptional", "We Make Things Better", "We Are People of Character", "We Welcome Every Voice", "We Win As a Team"], "ceo": "Joseph Dominguez, President and CEO", "h1b_sponsorship": "Yes - h1bdata.info shows 136 filings 2022-2026 (15 in 2026) including Senior Data Engineer, Senior Data Engineer AI, Quantitative Analyst and Structuring Analyst in Baltimore", "us_person_required": "Varies - corporate/commercial data roles are open to F-1; roles requiring unescorted nuclear-site access need security screening (their policy explicitly accepts Real ID, passport or visa as ID), which can still slow clearance for some sites", "open_jobs": [{"title": "Senior Engineering Analyst", "location": "Conowingo Generating Station (MD)", "url": "https://jobs.constellationenergy.com/culture/jobs/139536?lang=en-us"}, {"title": "Records Analyst", "location": "Byron NPS Sta 6 (IL)", "url": "https://jobs.constellationenergy.com/culture/jobs/139518?lang=en-us"}, {"title": "Data & analytics roles - JS-only search (featured roles render via /culture/jobs; use full search with keyword 'data')", "location": "Baltimore, MD / Chicago, IL / Houston, TX (varies)", "url": "https://jobs.constellationenergy.com/careers-home/jobs"}], "fit_score": 82, "fit_rationale": "Constellation is hiring Senior Data Engineer (AI) and Quantitative Analyst roles in Baltimore - directly matching her Data Engineer and Quant Analyst targets - and sponsored 15 H-1Bs already in 2026, including a Bellevue, WA software engineer (Seattle-area) hire. Her econometrics + DCF/financial modeling skills fit their power trading and structuring analytics, and her $75M-ARR churn model shows commercial-impact data work. Nuclear-site access screening is the only friction.", "talking_points": ["Power markets are the perfect use case for my econometrics and DCF modeling background - I'd love to hear how Constellation structures quant/market analytics roles.", "I saw your Senior Data Engineer, AI and Senior Quantitative Analyst H-1B hires in Baltimore - what does the new-grad pipeline into those teams look like?", "Constellation powers 80% of the Fortune 100; my Oracle churn model and 40+ source ETL work map to customer and trading data at that scale."], "booth": "", "problems": [{"title": "Crane Clean Energy Center restart: permitting, water, and schedule risk on a 2027 deadline", "problem": "Constellation is restarting the shuttered Three Mile Island Unit 1 as the Crane Clean Energy Center, backed by a 20-year Microsoft power purchase agreement to serve data-center load. On September 25, 2026, the NRC's Environmental Assessment and Finding of No Significant Impact became official in the Federal Register, letting the restart proceed without a full Environmental Impact Statement and saving significant time (ANS, Sept 29, 2026). Constellation aims to have the plant back online 'as early as next year' (2027), but it still needs Pennsylvania DEP Section 401 water quality certification and faces scrutiny over a requested ~73 million gallons/day withdrawal from the Susquehanna River (Google News coverage of DEP filings). Every week of delay shifts millions of dollars of PPA revenue and forces re-forecasting of the 2027 delivery commitment.", "source": "https://www.ans.org/news/2026-09-29/article-8442/nrc-roundup-crane-eafonsi-new-agreement-state/ ; https://www.govinfo.gov/content/pkg/FR-2026-09-25/html/2026-19603.htm ; https://news.google.com/rss/search?q=Constellation+Energy+data+center+PPA&hl=en-US&gl=US&ceid=US:en", "why_data_team": "Restart execution sits with Constellation's nuclear operations and project-management organizations, which track thousands of work orders, licensing milestones, and permit dependencies. It is a data problem because schedule risk, cost-to-complete, and first-power-date forecasts depend on integrating maintenance, regulatory, and supply-chain data that today live in separate systems.", "solution": "Build a restart-risk analytics layer: a milestone dependency graph (NRC, DEP 401, fuel, staffing, grid interconnection) feeding a gradient-boosted classification model that predicts slip probability per milestone, plus scenario simulation of first-power dates and their PPA revenue impact. A consolidated ETL pipeline could unify work-order, permit, and vendor data into one governed warehouse, with dashboards that flag at-risk critical-path items weekly. This mirrors the kind of event-risk and pipeline consolidation work Mimansa has already done at scale.", "bottlenecks": ["State and federal approvals still pending (DEP Section 401 water quality certification after the NRC EA/FONSI)", "Susquehanna River water withdrawal limits and public/regulatory opposition", "Nuclear safety constraints mean outage and restart work cannot be compressed arbitrarily", "Data silos across licensing, engineering, outage management, and commercial teams"], "mimansa_connection": "Her 70M+ event ETL pipeline and LightGBM risk model (0.72-0.74 AUC, 25x lift) is the exact pattern for predicting milestone-slip risk across Crane's restart schedule.", "booth_question": "How is Constellation integrating licensing, outage, and supply-chain data to forecast the Crane restart date, and where does the current forecasting stack fall short?"}, {"title": "PJM capacity shortfall and price-cap auctions: forecasting load and pricing risk as data centers strain the grid", "problem": "PJM's 2028/2029 Base Residual Auction on July 14, 2026 cleared at the FERC-approved price cap of $325/MW-day, procured 138,318 MW UCAP worth $16.4 billion, and came in 6,831 MW short of the reliability requirement - the second straight shortfall and the first time the full RTO missed the standard (PJM Inside Lines, July 14, 2026). PJM is planning a September backstop procurement, expedited interconnection, and 'Connect and Manage' frameworks that let data centers connect but curtail when needed. Market-monitor coverage shows data centers are driving a large share of capacity costs (Utility Dive: data centers were 40% of capacity costs in the last auction; $16.4B reliability price tag). For Constellation, the largest PJM generator, every auction outcome, curtailment rule, and load forecast directly changes revenue and hedging strategy.", "source": "https://insidelines.pjm.com/pjm-capacity-auction-procures-138318-mw-of-generation-resources-as-work-continues-to-address-growing-electricity-demand/ ; https://news.google.com/rss/search?q=PJM+capacity+auction+2026&hl=en-US&gl=US&ceid=US:en", "why_data_team": "Constellation's commercial/trading and market analytics teams price capacity, energy, and PPAs, while load forecasting supports the generation fleet. This is a data problem because data-center pipeline load, weather, interconnection queue dynamics, and auction parameters must be merged into probabilistic forecasts fast enough to inform bids and hedges.", "solution": "Develop an integrated load-and-price forecasting system: ingest data-center interconnection queue and county-level pipeline data, weather, and PJM auction parameters through automated DAG pipelines into a scenario engine that estimates capacity clearing prices, curtailment exposure, and PPA strike economics. Econometric load models plus Monte Carlo simulation can quantify revenue-at-risk under cap, backstop-auction, and Connect-and-Manage scenarios. Outputs feed trading desk hedging and long-term contract pricing.", "bottlenecks": ["Regulatory uncertainty: FERC filings on the backstop auction and co-location are still pending", "Interconnection queue and data-center pipeline data are fragmented across utilities, PJM, and developers", "Price collar caps volatility but masks true scarcity signals, complicating model calibration", "Data silos between generation planning and commercial trading desks"], "mimansa_connection": "Her automated DAG pipelines consolidating 40+ sources and 417K-record SQL/Python analytics map directly to merging PJM auction, weather, and queue data into a single forecasting product.", "booth_question": "With capacity clearing at the cap two auctions in a row, how is Constellation's analytics team modeling data-center load growth and curtailment rules in its revenue forecasts?"}, {"title": "Turning a record data-center PPA backlog into revenue: pricing, counterparty, and co-location uncertainty", "problem": "Constellation has been signing data-center and enterprise deals at a record pace - roughly 920 MW of new power deals including a Walmart PPA, plus a 20-year Amazon PPA adding 190 MW at Calvert Cliffs - yet its stock was down 25-31% in 2026, and analysts note the largest AI power deal does not start paying until June 2027 (Google News coverage of Motley Fool, tikr, and Constellation press releases). A June 2026 FERC filing on co-location could change the economics of serving data centers behind the meter. The gap between headline deal volume and realized revenue is a pricing, credit, and contract-modeling problem.", "source": "https://news.google.com/rss/search?q=Constellation+Energy+data+center+PPA&hl=en-US&gl=US&ceid=US:en ; https://news.google.com/rss/search?q=Constellation+Energy+2026&hl=en-US&gl=US&ceid=US:en", "why_data_team": "Constellation's commercial origination and risk teams own PPA structuring, while finance owns earnings guidance. It is a data problem because valuing hundreds of MW of long-dated contracts requires hourly generation profiles, counterparty credit data, and regulatory scenario modeling stitched into one valuation pipeline.", "solution": "Create a PPA valuation and portfolio-risk platform: pipeline data from origination, hourly nuclear output profiles, forward power curves, and counterparty financials into a DCF/scenario engine that computes contract value, revenue start-date sensitivity, and concentration risk. A counterparty risk score (survival-style model) can flag hyperscaler credit and contract-cancellation exposure, while RAG over FERC/PJM filings keeps regulatory assumptions current. Dashboard total portfolio value-at-risk under co-location and curtailment scenarios.", "bottlenecks": ["FERC co-location rules remain unsettled, changing whether deals are priced behind or in front of the meter", "Revenue timing lags: large AI deals may not pay until 2027, creating earnings-guidance risk", "Counterparty concentration in a handful of hyperscalers", "Data silos between origination, trading, and finance limit a single view of portfolio value"], "mimansa_connection": "Her $75M ARR churn model is a direct prototype for scoring counterparty/credit risk and revenue timing across Constellation's PPA portfolio, and her DCF background fits contract valuation.", "booth_question": "How does Constellation's analytics team value long-dated data-center PPAs and stress-test them against FERC co-location rulings and counterparty credit risk?"}]}, {"company": "Shell", "website": "https://www.shell.com", "careers_url": "https://www.shell.com/careers.html", "job_search_url": "https://jobs.shell.com/search/?q=data", "hq": "London, United Kingdom (Shell USA operations HQ: Houston, Texas)", "size": "~96,000 employees (2026)", "industry": "Oil & Gas / Integrated Energy", "business": "Shell is a British multinational energy company active in oil and gas exploration, production, refining, LNG, chemicals, power trading and retail fuels across 99+ countries. It earns revenue from selling oil, natural gas, LNG, refined products and petrochemicals, plus one of the world's largest commodity trading books. Its US arm (Shell USA, Houston) and Shell Global Solutions run large data science, AI and quantitative analytics teams.", "core_values": ["Honesty", "Integrity", "Respect for people"], "ceo": "Wael Sawan, Chief Executive Officer", "h1b_sponsorship": "Yes - h1bdata.info shows 229 records 2019-2026 (15 in 2026) across Shell International Exploration & Production, Shell Global Solutions and Shell Trading, with Data Scientist, Machine Learning Scientist and AI Resident titles sponsored", "us_person_required": "No - standard US work-authorization requirements only; Shell is a commercial energy company with no ITAR/clearance gate for corporate data and trading roles", "open_jobs": [{"title": "Data/analytics roles - JS-only careers search (listings not retrievable; use search URL with keywords e.g. 'data scientist', 'data engineer', 'quant')", "location": "Houston, TX / US remote (varies)", "url": "https://jobs.shell.com/search/?q=data"}], "fit_score": 80, "fit_rationale": "Shell sponsors H-1B for exactly her target roles - Data Scientist, ML Scientist and AI Resident titles appear in its filings - and Shell Trading/Global Solutions value the SQL + Python + financial modeling stack she has. Her Oracle churn work ($75M ARR at risk, 86% churn) and RAG pipeline (50K+ records) match their AI/ML data product needs. US roles concentrate in Houston rather than Seattle, so relocation flexibility matters.", "talking_points": ["I built a RAG/LLM pipeline over 50,000+ records and an ML churn model protecting $75M in ARR - both are the kind of applied AI Shell Global Solutions is scaling.", "My econometrics + DCF background from USF Economics and Cal Poly MSBA fits Shell Trading's quant and market analytics teams.", "Ask where new-grad data/AI hiring sits (Houston vs. global hubs) and how the AI Resident program works for international students."], "booth": "", "problems": [{"title": "LNG supply disruption and portfolio/trading volatility after the Iran conflict", "problem": "Shell's Q2 2026 adjusted profit jumped to $9.84 billion as the Iran war lifted oil trading and refining margins (LNG Prime, July 30, 2026; Reuters reported profit 'more than doubles'). At the same time, Reuters reported that attacks wiped out 17% of Qatar's LNG capacity for up to five years, and Shell sees global LNG trade flat in 2026 because Strait of Hormuz recovery remains uncertain (Bloomberg/World Oil headlines). Shell's LNG Outlook 2026 (June 4, 2026) describes a 'Hormuz shock and the coming supply crunch' while still projecting global LNG demand rising 65% by 2050 (Forbes/Yahoo Finance). Meanwhile Shell sanctioned LNG Canada Phase 2 (Sept 2026, doubling Kitimat capacity) and completed the $16.5bn ARC Resources gas acquisition (Sept 2, 2026), making cargo optimization and disruption forecasting urgent.", "source": "https://lngprime.com/europe/shells-q2-profit-jumps-to-9-84-billion-lng-sales-up/194067/ ; https://news.google.com/rss/search?q=Shell+LNG+earnings+2026&hl=en-US&gl=US&ceid=US:en ; https://www.reuters.com/business/energy/", "why_data_team": "Shell's LNG Trading & Supply and Strategy/Portfolio teams own this problem; matching cargoes to demand under war-driven disruption is fundamentally a forecasting, scenario simulation and constrained-optimization problem over messy real-time shipping, pricing, contract and outage data.", "solution": "Pitch a cargo-rerouting and disruption-scenario engine: ingest AIS shipping, weather, outage and price feeds into a gradient-boosted demand/shortfall model to rank alternative cargo allocations by margin-at-risk. Layer scenario simulation (Hormuz closure duration, Qatar outage length, LNG Canada ramp) over contracted volumes to quantify exposure by customer and hub, and ship an ops dashboard traders refresh hourly. Add an outage/flaring signal model so reroutes cut cost without worsening emissions.", "bottlenecks": ["Fragmented trading/JV data across Singapore, London and Houston with confidential contract terms", "Fast-moving geopolitical volatility makes features and labels stale quickly", "Shipping, storage and HSSE constraints limit which reroutes are actually feasible", "Legacy commodity trading and risk systems are hard to integrate with ML pipelines"], "mimansa_connection": "Her 70M+ event ETL feeding a LightGBM model (0.72-0.74 AUC, 25x lift) is exactly this shape: huge event streams, imbalanced disruption targets, decision-ready scoring.", "booth_question": "How is Shell's LNG trading analytics team incorporating real-time disruption signals like Hormuz risk and Qatar outages into cargo allocation decisions?"}, {"title": "Chemicals and Products losses plus buyback/capex discipline under investor pressure", "problem": "Reuters reported on Jan 7, 2026 that Shell flagged a loss in its chemicals and products unit, raising doubts over a $3.5 billion buyback, and on Feb 5, 2026 Reuters reported Shell missed profit expectations while keeping buyback pace; TradingView's Q1 2026 note put 2026 capex at $24-26bn. Shell's $3.0bn buyback programme (announced May 7, 2026) was then suspended from June 12 to July 14, 2026 for securities-law reasons tied to the ARC shareholder circular (Shell announcement via BOE Report). Q2 2026's $9.84bn profit was trading/refining-led, masking the structural downstream chemicals weakness.", "source": "https://boereport.com/2026/06/12/shell-announces-pause-in-share-buyback-programme/ ; https://news.google.com/rss/search?q=Shell+plc+2026&hl=en-US&gl=US&ceid=US:en", "why_data_team": "Downstream/Products finance and Manufacturing analytics teams own plant-level margin transparency; the loss is a data problem of joining refinery/cracker operations, feedstock costs, energy and commercial pricing across dozens of sites, currencies and JVs.", "solution": "Build a plant- and product-level margin decomposition pipeline (feedstock, energy, yield, turnaround, logistics) consolidated from ERP, plant historians and market feeds, then forecast margin by asset with gradient-boosted or structural time-series models and flag turnaround/energy-saving opportunities. Add working-capital and buyback-capacity forecasting so finance can stress-test cash after price shocks, and deliver one exec dashboard the CFO org trusts.", "bottlenecks": ["Legacy plant historians and site ERPs with inconsistent tags, units and time zones", "Data silos across countries and JVs; commercial terms are confidential", "Commodity price and FX volatility break naive margin models", "HSSE and union constraints limit changes to plant operating envelopes"], "mimansa_connection": "Her automated DAG pipelines consolidating 40+ sources and the $75M ARR churn model transfer directly to asset-level margin forecasting and cash reallocation decisions.", "booth_question": "Which downstream units have the worst data-to-margin visibility today, and how is the data team prioritizing them?"}, {"title": "Energy-transition retreat and activist pressure on portfolio and emissions reporting", "problem": "A climate activist shareholder group pushed BP and Shell in January 2026 on plans for declining oil demand (Reuters, Jan 14, 2026), and Shell has since leaned harder into hydrocarbons: it agreed to buy ARC Resources (announced Apr 27, 2026; completed at $16.5bn including debt, Sept 2026), acquired Tri Star Energy to more than double US company-owned retail sites, and took FID on LNG Canada Phase 2 (Shell Global headlines). At the same time it shed transition and retail assets, selling Sprng Energy to Aditya Birla Renewables and its European onshore renewables portfolio to TotalEnergies (Shell Global, 2026). Amnesty International also published internal-document allegations about Shell's Nigerian oil operations (Sept 2026), keeping ESG and human-rights scrutiny high.", "source": "https://news.google.com/rss/search?q=Shell+plc+2026&hl=en-US&gl=US&ceid=US:en ; https://news.google.com/rss/search?q=Shell+LNG+earnings+2026&hl=en-US&gl=US&ceid=US:en", "why_data_team": "Sustainability & reporting, Corporate Strategy and Investor Relations analytics own this; defending portfolio and emission claims, running demand scenarios and answering activists requires auditable, consolidated ESG plus financial data.", "solution": "Pitch an emissions-MRV and portfolio-scenario platform: harmonized asset-level Scope 1/2/3 pipelines (operator vs equity share), automated NCI/SECR-style reporting with data-quality scores, and a RAG assistant over disclosures and JV reports so IR can trace every published figure to source. Layer econometric demand scena   const q = state.q;
  if (!q) return true;
  const hay = [c.company, p.title, p.problem, p.solution, (p.bottlenecks || []).join(' '), p.booth_question, p.mimansa_connection].join(' ').toLowerCase();
  return hay.includes(q);
}

function renderStats() {
  const companies = briefing.companies;
  const problems = companies.reduce((n, c) => n + c.problems.length, 0);
  const bottlenecks = companies.reduce((n, c) => n + c.problems.reduce((m, p) => m + (p.bottlenecks || []).length, 0), 0);
  const done = companies.reduce((n, c) => n + c.problems.filter((p, i) => reviewed.has(pid(c.company, i))).length, 0);
  document.getElementById('stats').innerHTML =
    '<span><b>' + companies.length + '</b> companies</span>' +
    '<span><b>' + problems + '</b> researched problems</span>' +
    '<span><b>' + bottlenecks + '</b> bottlenecks mapped</span>' +
    '<span><b>' + done + '/' + problems + '</b> reviewed</span>' +
    '<span>Fair: <b>' + esc(briefing.fair.dates) + '</b></span>';
  document.getElementById('fairLine').innerText = briefing.fair.location + ' - ' + briefing.fair.dates;
}

function renderPills() {
  const el = document.getElementById('pills');
  let html = '<button class="pill' + (state.company === 'all' ? ' active' : '') + '" data-c="all"><span class="p-name">All companies</span><span class="p-meta">Full briefing</span></button>';
  briefing.companies.forEach(c => {
    const done = c.problems.filter((p, i) => reviewed.has(pid(c.company, i))).length;
    const pct = Math.round(done / c.problems.length * 100);
    html += '<button class="pill' + (state.company === c.company ? ' active' : '') + '" data-c="' + esc(c.company) + '">' +
      '<span class="p-name">' + esc(c.company) + '</span>' +
      '<span class="p-meta">' + c.fit_score + '% fit - ' + done + '/' + c.problems.length + ' reviewed</span>' +
      '<span class="p-prog"><i style="width:' + pct + '%"></i></span></button>';
  });
  el.innerHTML = html;
  el.querySelectorAll('.pill').forEach(b => b.addEventListener('click', () => { state.company = b.dataset.c; render(); }));
}

function snapshotHTML(c) {
  const warn = c.us_person_required && !/^no/i.test(c.us_person_required);
  return '<div class="snapshot">' +
    '<h2>' + esc(c.company) + '</h2>' +
    '<span class="fit">' + c.fit_score + '% fit</span>' +
    '<span class="snap-meta">' + esc(c.industry) + ' - ' + esc(c.hq) + ' - ' + esc(c.size) + ' - CEO: ' + esc(c.ceo) + '</span>' +
    '<span class="visa-line' + (warn ? ' warn' : '') + '">' + esc(c.h1b_sponsorship) + '</span>' +
    (warn ? '<span class="visa-line warn">' + esc(c.us_person_required) + '</span>' : '') +
    '<span class="snap-links">' +
      (c.website ? '<a href="' + esc(c.website) + '" target="_blank" rel="noopener noreferrer">Website</a>' : '') +
      (c.careers_url ? '<a href="' + esc(c.careers_url) + '" target="_blank" rel="noopener noreferrer">Careers</a>' : '') +
      (c.job_search_url ? '<a href="' + esc(c.job_search_url) + '" target="_blank" rel="noopener noreferrer">Data roles</a>' : '') +
    '</span></div>';
}

function problemCardHTML(c, p, i) {
  const id = pid(c.company, i);
  const isR = reviewed.has(id);
  const src = firstUrl(p.source);
  const bottlenecks = (p.bottlenecks || []).map(b => '<span class="chip">' + esc(b) + '</span>').join('');
  const flow =
    '<div class="flow">' +
      '<div class="flow-col"><span class="flow-label">The problem</span>' +
        '<div class="problem-box">' + esc(p.problem) + (src ? ' <a class="card-src" href="' + esc(src) + '" target="_blank" rel="noopener noreferrer">[source]</a>' : '') + '</div>' +
        '<span class="why-line"><b>Owned by:</b> ' + esc(p.why_data_team) + '</span></div>' +
      '<div class="flow-arrow">&#8594;</div>' +
      '<div class="flow-col"><span class="flow-label">The play (how to solve)</span><div class="play-box">' + esc(p.solution) + '</div></div>' +
      '<div class="flow-arrow">&#8594;</div>' +
      '<div class="flow-col"><span class="flow-label">Bottlenecks to expect</span><div class="chips">' + bottlenecks + '</div></div>' +
    '</div>';
  return '<div class="card' + (isR ? ' reviewed' : '') + '" data-id="' + esc(id) + '">' +
    '<div class="card-head">' +
      '<span class="card-num">' + (i + 1) + '</span>' +
      '<span class="card-title">' + esc(p.title) + '</span>' +
      '<span class="card-actions"><button class="reviewed-btn" data-id="' + esc(id) + '">' + (isR ? 'Reviewed' : 'Mark reviewed') + '</button></span>' +
    '</div>' + flow +
    '<div class="hook-row">' +
      '<div class="hook-box"><b>Your hook:</b> ' + esc(p.mimansa_connection) + '</div>' +
      '<div class="ask-box"><span><b>Ask at the booth:</b> ' + esc(p.booth_question) + '</span>' +
        '<button class="copy-btn" data-q="' + esc(p.booth_question).replace(/"/g, '&quot;') + '">Copy</button></div>' +
    '</div>' +
  '</div>';
}

function renderCompanies() {
  const shown = briefing.companies.filter(c => state.company === 'all' || c.company === state.company);
  let html = '';
  let total = 0;
  shown.forEach(c => {
    const cards = c.problems.map((p, i) => ({ p, i })).filter(({ p }) => matches(p, c));
    total += cards.length;
    if (!cards.length) return;
    html += '<section class="section">' + snapshotHTML(c) +
      '<div class="cards">' + cards.map(({ p, i }) => problemCardHTML(c, p, i)).join('') + '</div></section>';
  });
  if (!html) html = '<div class="section"><div class="snapshot">No problems match "' + esc(state.q) + '". Try another keyword.</div></div>';
  const content = document.getElementById('content');
  content.innerHTML = html;
  content.querySelectorAll('.reviewed-btn').forEach(btn => btn.addEventListener('click', () => {
    const id = btn.dataset.id;
    reviewed.has(id) ? reviewed.delete(id) : reviewed.add(id);
    saveReviewed(); render();
  }));
}
function renderQuestions() {
  const rows = [];
  briefing.companies.filter(c => state.company === 'all' || c.company === state.company).forEach(c => {
    c.problems.forEach(p => { if (matches(p, c)) rows.push({ c: c.company, q: p.booth_question }); });
  });
  document.getElementById('content').innerHTML = '<table><thead><tr><th style="width:170px;">Company</th><th>Question to ask</th><th style="width:60px;"></th></tr></thead><tbody>' +
    (rows.length ? rows.map(r => '<tr><td class="q-company">' + esc(r.c) + '</td><td>' + esc(r.q) + '</td><td><button class="copy-btn" data-q="' + esc(r.q).replace(/"/g, '&quot;') + '">Copy</button></td></tr>').join('') : '<tr><td colspan="3">No questions match the search.</td></tr>') +
    '</tbody></table>';
  wireCopy();
}
function renderMatrix() {
  const rows = [];
  briefing.companies.filter(c => state.company === 'all' || c.company === state.company).forEach(c => {
    c.problems.forEach((p, i) => { if (matches(p, c)) rows.push({ c: c.company, p, i }); });
  });
  const head = '<thead><tr><th style="width:210px;">Company / Problem</th>' + THEMES.map(t => '<th style="text-align:center; font-size:9px;">' + t.name + '</th>').join('') + '</tr></thead>';
  const body = '<tbody>' + rows.map(r => {
    const themes = themesFor(r.p);
    return '<tr><td><b>' + esc(r.c) + '</b><br><span class="snap-meta">' + (r.i + 1) + '. ' + esc(r.p.title) + '</span></td>' +
      THEMES.map(t => '<td style="text-align:center;"><span class="dot' + (themes.includes(t.name) ? ' on' : '') + '"></span></td>').join('') + '</tr>';
  }).join('') + '</tbody>';
  document.getElementById('content').innerHTML = '<table>' + head + body + '</table>' +
    '<footer>Dots show which bottleneck themes each problem hits (keyword-derived from researched bottlenecks + problem text). Use it to spot patterns: multiple companies share silos, data-quality lag, and regulatory uncertainty - lead booth conversations with those themes.</footer>';
}
function wireCopy() {
  document.querySelectorAll('.copy-btn').forEach(b => b.addEventListener('click', () => {
    const t = b.dataset.q || '';
    const done = () => { const o = b.innerText; b.innerText = 'Copied'; setTimeout(() => b.innerText = o, 1200); };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(t).then(done).catch(done);
    else done();
  }));
}
function render() {
  renderStats(); renderPills();
  document.querySelectorAll('.viewtab').forEach(t => t.classList.toggle('active', t.dataset.view === state.view));
  if (state.view === 'companies') renderCompanies();
  else if (state.view === 'questions') renderQuestions();
  else renderMatrix();
  wireCopy();
}
document.getElementById('search').addEventListener('input', e => { state.q = e.target.value.toLowerCase().trim(); render(); });
document.querySelectorAll('.viewtab').forEach(t => t.addEventListener('click', () => { state.view = t.dataset.view; render(); }));
render();
</script>
</body>
</html>
